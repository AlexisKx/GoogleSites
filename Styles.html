<style>
  :root {
    --bg: #F4F6FB;
    --card: #FFFFFF;
    --ink: #0B1426;
    --ink-2: #1A2238;
    --muted: #6B7280;
    --muted-2: #9CA3AF;
    --border: #E5E8EF;
    --border-2: #EDF0F5;

    --nav: #0B1E3D;
    --nav-ink: #FFFFFF;
    --nav-muted: #93A5C7;
    --nav-active: #1E3A6C;

    --brand: #2563EB;
    --brand-soft: #EEF3FF;
    --ok: #10B981;
    --ok-soft: #D1FAE5;
    --warn: #F59E0B;
    --warn-soft: #FEF3C7;
    --err: #EF4444;
    --err-soft: #FEE2E2;
    --neutral-soft: #F1F4F9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ───────── Top bar ───────── */
  .topbar {
    background: var(--nav);
    color: var(--nav-ink);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .topbar .brand-block h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .3px;
  }
  .topbar .brand-block .tag {
    color: var(--nav-muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .topbar .brand-block .tag b { color: #fff; font-weight: 600; }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 500;
  }
  .pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
  }

  /* ───────── App shell ───────── */
  .app { display: flex; min-height: calc(100vh - 70px); }
  .sidebar {
    width: 230px; flex: 0 0 230px;
    background: #FFFFFF;
    border-right: 1px solid var(--border);
    padding: 18px 12px;
    display: flex; flex-direction: column;
  }
  nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  nav a {
    text-decoration: none;
    color: var(--ink-2);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    transition: background .12s, color .12s;
  }
  nav a:hover { background: var(--neutral-soft); }
  nav a.active { background: var(--brand); color: #fff; font-weight: 600; }
  nav a.hidden { display: none; }
  .me {
    font-size: 12px;
    color: var(--muted);
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
    line-height: 1.5;
  }
  .me strong { display: block; color: var(--ink); margin-bottom: 2px; word-break: break-all; font-weight: 600; }

  /* ───────── Main ───────── */
  .main { flex: 1; min-width: 0; padding: 24px 32px 60px; }
  .page-head { margin-bottom: 18px; }
  .page-head h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.2px; }
  .page-head .desc { color: var(--muted); margin-top: 4px; font-size: 13.5px; }

  .view { display: flex; flex-direction: column; gap: 18px; }

  /* ───────── Cards ───────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  h2 { font-size: 17px; margin: 0 0 6px; font-weight: 700; color: var(--ink); }
  h3 { font-size: 14px; margin: 14px 0 6px; font-weight: 600; color: var(--ink-2); }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; line-height: 1.5; }
  code {
    background: var(--neutral-soft);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12.5px;
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color: var(--ink-2);
  }

  /* ───────── Forms ───────── */
  .row { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .field > span {
    font-size: 11.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 600;
  }
  input, .search {
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    width: 100%;
    font-family: inherit;
    transition: border-color .12s, box-shadow .12s;
  }
  input:focus, .search:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }
  .search { margin-bottom: 14px; }

  .drop {
    display: flex; align-items: center; justify-content: center; flex: 2;
    border: 2px dashed #C7D0E0; border-radius: 12px; padding: 24px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
    min-height: 80px; background: #FAFBFD;
    font-weight: 500;
  }
  .drop:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  input[type=file] { display: none; }

  /* ───────── Buttons ───────── */
  button {
    padding: 11px 18px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    background: var(--neutral-soft);
    color: var(--ink-2);
    font-family: inherit;
    transition: filter .12s, transform .05s;
  }
  button:hover { filter: brightness(.97); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--brand); color: #fff; }
  button.primary:disabled { background: #AAB4CF; cursor: not-allowed; transform: none; }
  button.ghost { background: transparent; border: 1px solid var(--border); }
  button.dark { background: var(--nav); color: #fff; }
  button.danger { background: var(--err-soft); color: var(--err); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* ───────── Status text ───────── */
  .status { margin-top: 14px; font-size: 13.5px; line-height: 1.55; }
  .ok { color: var(--ok); font-weight: 600; }
  .err { color: var(--err); font-weight: 600; }
  .warn { color: var(--warn); font-weight: 600; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  a.dl {
    display: inline-block; margin-top: 12px; padding: 10px 18px;
    background: var(--ok); color: #fff; border-radius: 10px;
    text-decoration: none; font-weight: 600; font-size: 13.5px;
  }
  a.dl:hover { filter: brightness(.95); }

  /* ───────── Tabs (result tabs / GEO admin tabs) ───────── */
  .tabs {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .tab-row { display: flex; border-bottom: 1px solid var(--border); background: #FAFBFD; }
  .tab {
    flex: 1; background: transparent; border: 0;
    padding: 14px 16px; border-radius: 0;
    font-weight: 600; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent;
    font-size: 13.5px;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); background: #fff; }
  .tab-pane { display: none; padding: 20px; }
  .tab-pane.active { display: block; }

  /* ───────── Status pills ───────── */
  .badge {
    display: inline-flex; align-items: center;
    min-width: 22px; padding: 2px 9px;
    border-radius: 999px;
    background: var(--warn-soft); color: var(--warn);
    font-size: 11.5px; font-weight: 600; margin-left: 6px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
  }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.err { background: var(--err-soft); color: var(--err); }
  .chip.neutral { background: var(--neutral-soft); color: var(--ink-2); }

  /* ───────── Tables ───────── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th {
    background: #FAFBFD; font-weight: 600;
    text-transform: uppercase; font-size: 11.5px; letter-spacing: .4px;
    color: var(--muted);
  }
  tbody tr:hover { background: #FAFBFD; }
  .scroll {
    max-height: 480px; overflow: auto;
    border: 1px solid var(--border); border-radius: 12px; background: #fff;
  }

  /* ───────── Stat cards (Summary tab) ───────── */
  .summary-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .stat {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .stat .lbl {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-bottom: 8px;
  }
  .stat .num {
    font-size: 28px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -.5px;
  }
  .stat.read .num { color: var(--brand); }
  .stat.written .num { color: var(--ok); }
  .stat.skipped .num { color: var(--err); }

  /* ───────── Lists ───────── */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .list .item {
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    transition: border-color .12s, box-shadow .12s;
  }
  .list .item:hover { border-color: #D5DBE6; box-shadow: 0 2px 8px rgba(15,23,42,0.05); }
  .list .item strong { font-weight: 600; }
  .list .item .meta { margin: 2px 0 0; }

  /* ───────── About ───────── */
  .cols { columns: 2; max-width: 560px; }
  .cols li { margin-bottom: 4px; }

  /* ───────── Responsive ───────── */
  @media (max-width: 880px) {
    .topbar { padding: 14px 18px; flex-wrap: wrap; }
    .app { flex-direction: column; min-height: 0; }
    .sidebar { width: auto; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid var(--border); }
    nav { flex-direction: row; flex-wrap: wrap; }
    nav a { padding: 8px 12px; font-size: 13px; }
    .me { border-top: 0; margin-top: 0; padding: 8px 12px 0; }
    .main { padding: 18px 18px 40px; }
    .grid2 { grid-template-columns: 1fr; }
    .cols { columns: 1; }
  }
</style>
