<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <?!= include('LookupsClient'); ?>
  <?!= include('Styles'); ?>
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <h1>📡 NAP DATA CONVERTER</h1>
      <div class="tag">Territory 7 · <b>Network Access Point</b> cleanup &amp; reporting</div>
    </div>
    <div class="topbar-right">
      <span class="pill"><span class="dot"></span> <span id="todayPill">Today</span></span>
      <span class="pill" id="userPill" style="display:none"></span>
      <button id="logoutBtn" class="ghost" style="display:none; background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18)">Log out</button>
    </div>
  </header>

  <div id="app" class="app">
    <aside class="sidebar">
      <nav id="nav"></nav>
      <div class="me" id="me"></div>
    </aside>

    <main class="main">
      <div class="page-head">
        <h2 id="pageTitle">Converter</h2>
        <div class="desc" id="pageDesc"></div>
      </div>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- ============ LOGIN ============ -->
  <template id="tpl-login">
    <div class="card" style="max-width:420px; margin:60px auto">
      <h2>🔐 Sign in</h2>
      <p class="sub">Enter your username and password to access the NAP Data Converter.</p>
      <label class="field"><span>Username</span><input id="loginUser" autocomplete="username"></label>
      <label class="field" style="margin-top:12px"><span>Password</span><input id="loginPass" type="password" autocomplete="current-password"></label>
      <div class="actions">
        <button id="loginGo" class="primary" style="flex:1">Sign in</button>
      </div>
      <div class="status" id="loginStatus"></div>
    </div>
  </template>

  <!-- ============ CONVERTER ============ -->
  <template id="tpl-converter">
    <div class="card">
      <div class="row">
        <label class="field">
          <span>Report date</span>
          <input type="date" id="snapDate">
        </label>
        <label class="drop" id="drop">
          <span id="dropText">📂 Click to choose your NAP CSV (up to ~700 MB)</span>
          <input type="file" id="file" accept=".csv,text/csv">
        </label>
      </div>
      <div class="actions">
        <button id="go" class="primary" disabled>🚀 Convert &amp; Download</button>
      </div>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">Starting…</div>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="tabs" id="resultTabs" hidden>
      <div class="tab-row">
        <button class="tab active" data-tab="summary">📊 Summary</button>
        <button class="tab" data-tab="preview">👀 Preview</button>
        <button class="tab" data-tab="missing">⚠️ Missing Location <span id="missCount" class="badge">0</span></button>
      </div>
      <div class="tab-pane active" data-pane="summary" id="paneSummary"></div>
      <div class="tab-pane" data-pane="preview" id="panePreview"></div>
      <div class="tab-pane" data-pane="missing" id="paneMissing"></div>
    </div>
  </template>

  <!-- ============ GEO REFERENCE ============ -->
  <template id="tpl-geo">
    <div class="tabs">
      <div class="tab-row">
        <button class="tab active" data-tab="edit">➕ Add / Edit</button>
        <button class="tab" data-tab="bulk">📤 Bulk Upload</button>
        <button class="tab" data-tab="view">📋 View All</button>
      </div>

      <div class="tab-pane active" data-pane="edit">
        <div class="card">
          <h2>Add or update a single entry</h2>
          <p class="sub">Type a NAP ID, optionally click <em>Load existing</em> to prefill, then save.</p>
          <div class="grid2">
            <label class="field"><span>NAP ID</span><input id="geoNap" placeholder="e.g. DVO05L02N01"></label>
            <label class="field"><span>City</span><input id="geoCity"></label>
            <label class="field"><span>Barangay</span><input id="geoBrgy"></label>
            <label class="field"><span>Location tagging</span><input id="geoLoc"></label>
          </div>
          <div class="actions">
            <button class="primary" id="geoSave">💾 Save</button>
            <button class="ghost" id="geoLoad">🔎 Load existing</button>
            <button class="ghost" id="geoClear">Cancel</button>
            <button class="danger" id="geoDel">🗑️ Delete</button>
          </div>
          <div class="status" id="geoStatus"></div>
        </div>
      </div>

      <div class="tab-pane" data-pane="bulk">
        <div class="card">
          <h2>Bulk upload</h2>
          <p class="sub">Excel must have columns: <code>NAP ID</code>, <code>CITY_NAME</code>, <code>BRGY_NAME</code>, <code>LOCATION TAGGING</code>. Existing entries are updated, new ones are added.</p>
          <label class="drop">
            <span id="bulkText">📄 Click to choose your Excel file</span>
            <input type="file" id="bulkFile" accept=".xlsx,.xls">
          </label>
          <div class="actions">
            <button class="primary" id="bulkGo" disabled>Upload</button>
          </div>
          <div class="status" id="bulkStatus"></div>
        </div>
      </div>

      <div class="tab-pane" data-pane="view">
        <div class="card">
          <h2>All entries</h2>
          <input id="geoSearch" placeholder="Search by NAP ID, city, barangay…" class="search">
          <div id="geoList" class="list"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ USERS (admin) ============ -->
  <template id="tpl-users">
    <div class="card">
      <h2>Add new user</h2>
      <p class="sub">Pick a username, set an initial password (≥ 8 chars), and choose whether this user is an admin. Admins can manage users and GEO Reference.</p>
      <div class="grid2">
        <label class="field"><span>Username</span><input id="newUser" autocomplete="off"></label>
        <label class="field"><span>Password</span><input id="newPass" type="password" autocomplete="new-password"></label>
      </div>
      <label class="field" style="margin-top:10px; flex-direction:row; align-items:center; gap:8px">
        <input type="checkbox" id="newIsAdmin" style="width:auto">
        <span style="font-size:13.5px; color:var(--ink-2); text-transform:none; letter-spacing:0; font-weight:500">Grant admin access</span>
      </label>
      <div class="actions">
        <button class="primary" id="userAdd">Create user</button>
      </div>
      <div class="status" id="userAddStatus"></div>
    </div>

    <div class="card">
      <h2>Existing users</h2>
      <p class="sub">Reset a user's password, toggle admin, or delete the account. Users are auto-signed-out when their password is reset.</p>
      <div id="userList" class="list"></div>
    </div>
  </template>

  <!-- ============ CHANGE MY PASSWORD ============ -->
  <template id="tpl-password">
    <div class="card" style="max-width:520px">
      <h2>Change your password</h2>
      <p class="sub">After changing your password, you'll be signed out from any other browsers / sessions automatically.</p>
      <label class="field"><span>Current password</span><input id="curPass" type="password" autocomplete="current-password"></label>
      <label class="field" style="margin-top:12px"><span>New password</span><input id="newPw" type="password" autocomplete="new-password"></label>
      <label class="field" style="margin-top:12px"><span>Confirm new password</span><input id="newPw2" type="password" autocomplete="new-password"></label>
      <div class="actions">
        <button class="primary" id="pwChange">Update password</button>
      </div>
      <div class="status" id="pwStatus"></div>
    </div>
  </template>

  <!-- ============ ABOUT ============ -->
  <template id="tpl-about">
    <div class="card">
      <h2>About this app</h2>
      <p class="sub">Google Apps Script port of the Streamlit NAP Converter. All file processing now happens <strong>in your browser</strong>, so it handles 100–700 MB files without hitting Apps Script's 6-minute or 50 MB limits.</p>
      <h3>Output columns</h3>
      <ol class="cols"></ol>
      <h3>How it works</h3>
      <ul>
        <li><strong>Browser</strong> streams the CSV, parses + merges + enriches, builds the Excel, triggers download.</li>
        <li><strong>Apps Script</strong> only stores the GEO_REFERENCE, the user accounts, and active sessions.</li>
        <li>PLA ID, Tech, Sales Area, Province, Territory are derived from the same dictionaries the Python script uses (bundled into the page).</li>
      </ul>
      <h3>Notes</h3>
      <ul>
        <li>Output XLSX size scales with row count. For 700 MB CSV the resulting Excel can be 50–200 MB — make sure you have RAM.</li>
        <li>The browser tab will say "loading" for a while during big conversions. That's normal — don't close it. A progress bar shows live status.</li>
        <li>Conversions are <strong>not saved</strong> anywhere. Re-run if you need the file again.</li>
        <li>Sessions last 24 hours, then you'll be asked to sign in again.</li>
      </ul>
    </div>
  </template>

  <?!= include('Scripts'); ?>
</body>
</html>
