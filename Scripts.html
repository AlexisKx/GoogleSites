<script>
  /* eslint-disable */

  // ============================================================
  // State
  // ============================================================
  const TOKEN_KEY = 'nap_token_v1';
  let session = null;   // { token, username, isAdmin }

  // Pages once authenticated. `admin: true` → only admins see it.
  const PAGES = [
    { id: 'converter', label: '📡 Converter',        admin: false, title: 'Converter',         desc: 'Upload a NAP CSV, get a cleaned Excel back. All processing runs in your browser — no server limits.' },
    { id: 'geo',       label: '📁 GEO Reference',    admin: true,  title: 'GEO reference',     desc: 'Manage City / Barangay / Location Tagging by NAP ID.' },
    { id: 'users',     label: '👥 Users',            admin: true,  title: 'Users',             desc: 'Manage who can sign in to this app.' },
    { id: 'password',  label: '🔒 Change Password', admin: false, title: 'Change password',   desc: 'Update your own password.' },
    { id: 'about',     label: 'ℹ️ About',             admin: false, title: 'About',             desc: 'How the converter works and what its limits are.' }
  ];

  let geoData = null;
  let bulkPayload = null;

  // ============================================================
  // Boilerplate
  // ============================================================
  function callRaw(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err))
        [fn](...args);
    });
  }
  // call() automatically passes the session token as the first arg.
  function call(fn, ...args) {
    if (!session || !session.token) {
      return Promise.reject(new Error('Not signed in.'));
    }
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => {
          // Auto-logout on session-expired error.
          const msg = (err && err.message) || String(err);
          if (/session has expired/i.test(msg) || /not signed in/i.test(msg)) {
            clearSession();
            showLogin('Your session expired. Please sign in again.');
          }
          reject(err);
        })
        [fn](session.token, ...args);
    });
  }

  const $  = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmtNum = n => Number(n || 0).toLocaleString();
  const todayISO = () => { const d = new Date(); return d.toISOString().slice(0,10); };
  const fmtBytes = b => b > 1048576 ? (b/1048576).toFixed(1) + ' MB' : (b/1024).toFixed(1) + ' KB';
  const fmtDuration = ms => ms < 1000 ? ms + ' ms' : (ms/1000).toFixed(1) + ' s';

  // ============================================================
  // Auth UI
  // ============================================================
  function persistSession(sess) {
    session = sess;
    try { localStorage.setItem(TOKEN_KEY, JSON.stringify(sess)); } catch (e) {}
  }
  function clearSession() {
    session = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }
  function loadStoredSession() {
    try {
      const raw = localStorage.getItem(TOKEN_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function showLogin(message) {
    // Hide sidebar + nav, show login card.
    $('#nav').innerHTML = '';
    $('#me').innerHTML = '';
    $('#userPill').style.display = 'none';
    $('#logoutBtn').style.display = 'none';
    $('#todayPill').textContent = 'Sign in to continue';
    $('#pageTitle').textContent = 'Sign in';
    $('#pageDesc').textContent  = 'Enter your username and password to access the NAP Data Converter.';

    // Replace whole app with just the login card.
    $('#app').innerHTML = `<main class="main" style="flex:1"></main>`;
    const main = $('#app .main');
    const tpl = $('#tpl-login');
    main.appendChild(tpl.content.cloneNode(true));

    if (message) $('#loginStatus').innerHTML = `<div class="warn">${esc(message)}</div>`;

    const tryLogin = async () => {
      const u = $('#loginUser').value.trim();
      const p = $('#loginPass').value;
      if (!u || !p) {
        $('#loginStatus').innerHTML = '<div class="err">Enter your username and password.</div>';
        return;
      }
      $('#loginGo').disabled = true;
      $('#loginStatus').innerHTML = '⏳ Signing in…';
      try {
        const res = await callRaw('login', u, p);
        persistSession({ token: res.token, username: res.username, isAdmin: res.isAdmin });
        location.hash = 'converter';
        mountApp();
      } catch (err) {
        $('#loginStatus').innerHTML = `<div class="err">❌ ${esc(err.message || err)}</div>`;
      } finally {
        $('#loginGo').disabled = false;
      }
    };
    $('#loginGo').onclick = tryLogin;
    $('#loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
    $('#loginUser').focus();
  }

  // ============================================================
  // App shell
  // ============================================================
  function mountApp() {
    // Rebuild full app shell (sidebar + main).
    $('#app').innerHTML = `
      <aside class="sidebar">
        <nav id="nav"></nav>
        <div class="me" id="me"></div>
      </aside>
      <main class="main">
        <div class="page-head">
          <h2 id="pageTitle">Converter</h2>
          <div class="desc" id="pageDesc"></div>
        </div>
        <section id="view" class="view"></section>
      </main>`;
    $('#logoutBtn').style.display = 'inline-flex';
    $('#logoutBtn').onclick = doLogout;

    renderNav();
    const initial = (location.hash || '#converter').slice(1);
    const allowed = PAGES.find(p => p.id === initial && (!p.admin || session.isAdmin));
    setPage(allowed ? initial : 'converter');
  }

  async function doLogout() {
    try { if (session && session.token) await callRaw('logout', session.token); } catch (e) {}
    clearSession();
    showLogin('Signed out. Sign in to continue.');
  }

  function setPage(id) { location.hash = id; renderNav(); render(id); }

  function renderNav() {
    const nav = $('#nav'); nav.innerHTML = '';
    const current = (location.hash || '#converter').slice(1);
    PAGES.forEach(p => {
      if (p.admin && !session.isAdmin) return;
      const a = document.createElement('a');
      a.textContent = p.label;
      a.className = (p.id === current ? 'active' : '');
      a.onclick = () => setPage(p.id);
      nav.appendChild(a);
    });
    $('#me').innerHTML = `<strong>${esc(session.username)}</strong>${session.isAdmin ? 'Admin' : 'User'}`;
    $('#userPill').style.display = 'inline-flex';
    $('#userPill').innerHTML = `👤 ${esc(session.username)}${session.isAdmin ? ' · Admin' : ''}`;
    $('#todayPill').textContent = 'Today · ' + new Date().toLocaleDateString();
  }

  function render(id) {
    const page = PAGES.find(p => p.id === id) || PAGES[0];
    if (page.admin && !session.isAdmin) {
      $('#pageTitle').textContent = 'Access denied';
      $('#pageDesc').textContent = '';
      $('#view').innerHTML = `<div class="card"><p class="err">This page requires admin access.</p></div>`;
      return;
    }
    $('#pageTitle').textContent = page.title;
    $('#pageDesc').textContent = page.desc;
    const tpl = $('#tpl-' + id);
    $('#view').innerHTML = '';
    $('#view').appendChild(tpl.content.cloneNode(true));
    ({ converter: initConverter, geo: initGeo, users: initUsers, password: initPassword, about: initAbout })[id]();
  }

  // ============================================================
  // CONVERTER (all client-side, same as before)
  // ============================================================
  const OUTPUT_COL_SPECS = [
    ['CABINET',          24, false, null],
    ['NAP ID',           22, false, null],
    ['DISCOVERED WHEN',  22, false, null],
    ['PLA ID',           12, false, null],
    ['TECH',             14, false, null],
    ['PORTS ASSIGNED',   16, true,  null],
    ['PORTS RESERVED',   16, true,  null],
    ['PORTS TOTAL',      13, true,  null],
    ['UTILIZATION',      13, true,  '0%'],
    ['LATITUDE',         18, false, null],
    ['LONGITUDE',        18, false, null],
    ['SALES_AREA',       16, false, null],
    ['TERRITORY',        16, false, null],
    ['BRGY_NAME',        22, false, null],
    ['CITY_NAME',        22, false, null],
    ['PROVINCE_NAME',    22, false, null],
    ['LOCATION TAGGING', 24, false, null]
  ];
  const OUTPUT_COLS = OUTPUT_COL_SPECS.map(s => s[0]);
  const HEADER_FILL_ARGB = 'FFD9EAD3';

  const TRAILING_COLS = 12;
  const JUNK_PATTERNS = [
    /^\s*nap facility summary report/i,
    /^\s*object\s*:/i,
    /^\s*specified report/i,
    /^\s*nap name pattern/i,
    /^\s*report results/i,
    /^\s*\d+\s+rows?\s+are\s+displayed/i,
    /^\s*location\s*$/i
  ];

  function isJunkRow(raw) {
    const first = raw.split(';')[0].trim();
    for (let i = 0; i < JUNK_PATTERNS.length; i++) if (JUNK_PATTERNS[i].test(first)) return true;
    return false;
  }

  function parseRaw(raw) {
    const fields = raw.split(';');
    const n = fields.length;
    if (n < TRAILING_COLS + 6) return null;
    const tail = fields.slice(n - TRAILING_COLS);
    return {
      cabinet:        (tail[4]   || '').trim(),
      napId:          (fields[1] || '').trim(),
      lat:            (tail[0]   || '').trim(),
      lon:            (tail[1]   || '').trim(),
      discovered:     (tail[2]   || '').trim(),
      portsTotal:     (tail[6]   || '').trim(),
      portsAssigned:  (tail[7]   || '').trim(),
      portsReserved:  (tail[8]   || '').trim()
    };
  }

  function stripSuffix(napId) {
    return String(napId || '').replace(/(\d)[A-Za-z]$/, '$1');
  }

  function getNapPrefix(napId) {
    if (!napId) return '';
    const u = String(napId).trim().toUpperCase();
    for (let i = 0; i < SORTED_PREFIXES.length; i++) {
      if (u.indexOf(SORTED_PREFIXES[i]) === 0) return SORTED_PREFIXES[i];
    }
    return '';
  }

  function getTerritory(napId) {
    if (!napId) return '';
    const u = String(napId).trim().toUpperCase();
    for (let i = 0; i < SORTED_PREFIXES.length; i++) {
      const p = SORTED_PREFIXES[i];
      if (u === p) return PREFIX_TERRITORY[p];
      if (u.length > p.length) {
        const next = u.charAt(p.length);
        const isDelim = next === '_' || next === '-' || next === 'L' || (next >= '0' && next <= '9');
        if (isDelim && u.indexOf(p) === 0) return PREFIX_TERRITORY[p];
      }
    }
    return '';
  }

  function getSalesArea(napId) { return NAP_AREA_LOOKUP[getNapPrefix(napId)] || ''; }
  function getProvince(napId)  { return NAP_PROVINCE_LOOKUP[getNapPrefix(napId)] || ''; }

  function getTech(cabinet) {
    if (!cabinet) return '';
    const u = String(cabinet).toUpperCase();
    if (u.indexOf('LSA') !== -1) return 'GPON';
    if (cabinet.indexOf('-M') !== -1) return CABINET_TECH_LOOKUP[cabinet] || 'ADSL/VDSL';
    return 'GPON';
  }

  function getPlaId(cabinet) {
    if (!cabinet) return '';
    const parts = String(cabinet).trim().split('_');
    if (parts.length >= 2) {
      const k2 = parts[0] + '_' + parts[1];
      if (PLA_ID_LOOKUP[k2] != null) return PLA_ID_LOOKUP[k2];
    }
    if (PLA_ID_LOOKUP[parts[0]] != null) return PLA_ID_LOOKUP[parts[0]];
    return '';
  }

  function calcUtilization(pa, pt) {
    const a = typeof pa === 'number' ? pa : parseInt(pa, 10);
    const t = typeof pt === 'number' ? pt : parseInt(pt, 10);
    if (isNaN(t)) return '';
    if (t === 0) return 0;
    if (isNaN(a)) return '';
    return Math.round((a / t) * 10000) / 10000;
  }

  async function* readLines(file, onByteProgress) {
    const reader = file.stream().pipeThrough(new TextDecoderStream('utf-8', { fatal: false })).getReader();
    let buf = '';
    let bytes = 0;
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) {
          if (buf) yield buf.replace(/\r$/, '');
          return;
        }
        bytes += value.length;
        buf += value;
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          yield buf.slice(0, nl).replace(/\r$/, '');
          buf = buf.slice(nl + 1);
        }
        if (onByteProgress) onByteProgress(bytes);
      }
    } finally {
      try { reader.releaseLock(); } catch (e) {}
    }
  }

  function setProgress(pct, text) {
    $('#progressWrap').hidden = false;
    $('#progressBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (text != null) $('#progressText').textContent = text;
  }
  function hideProgress() { $('#progressWrap').hidden = true; }
  const tick = () => new Promise(r => setTimeout(r, 0));

  function initConverter() {
    $('#snapDate').value = todayISO();
    let pickedFile = null;

    $('#file').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      pickedFile = f;
      $('#dropText').textContent = `📄 ${f.name}  (${fmtBytes(f.size)})`;
      $('#go').disabled = false;
    });

    $('#go').addEventListener('click', async () => {
      if (!pickedFile) return;
      $('#go').disabled = true;
      $('#status').innerHTML = '';
      $('#resultTabs').hidden = true;
      try {
        if (!geoData) {
          setProgress(2, 'Loading GEO reference…');
          await tick();
          geoData = await call('getGeoData');
        }
        const stem = pickedFile.name.replace(/\.csv$/i, '').replace(/[^A-Za-z0-9._-]+/g, '_');
        const outName = `${stem}_${$('#snapDate').value}_cleaned.xlsx`;
        const res = await convertFile(pickedFile, geoData);

        setProgress(98, 'Writing Excel file…');
        await tick();
        const blob = await buildXlsxBlob(res.rows);
        const url = URL.createObjectURL(blob);
        setProgress(100, 'Done.');
        setTimeout(hideProgress, 800);

        renderResult({
          read: res.read, written: res.written, skipped: res.skipped,
          duration: res.duration, snapshotDate: $('#snapDate').value,
          downloadUrl: url, downloadName: outName,
          xlsxBytes: blob.size,
          preview: res.rows.slice(0, 50), missing: res.missing
        });
      } catch (err) {
        hideProgress();
        $('#status').innerHTML = `<div class="err">❌ ${esc(err.message || err)}</div>`;
        console.error(err);
      } finally {
        $('#go').disabled = false;
      }
    });
  }

  async function convertFile(file, geo) {
    const started = performance.now();
    const totalBytes = file.size;
    let bytesRead = 0;
    let lineNum = 0, readCount = 0, skipped = 0;
    const merged = new Map();
    const order = [];

    setProgress(3, 'Parsing CSV…');
    await tick();
    let lastTick = performance.now();

    for await (const raw of readLines(file, b => { bytesRead = b; })) {
      lineNum++;
      if (lineNum === 1) continue;
      if (!raw || !raw.replace(/;/g, '').trim()) continue;
      if (isJunkRow(raw)) continue;
      readCount++;

      const rec = parseRaw(raw);
      if (rec === null) { skipped++; continue; }
      const territory = getTerritory(rec.napId);
      if (!territory) { skipped++; continue; }

      const base = stripSuffix(rec.napId);
      const newPa = parseInt(rec.portsAssigned, 10);
      const newPr = parseInt(rec.portsReserved, 10);
      const newPt = parseInt(rec.portsTotal, 10);

      let e = merged.get(base);
      if (!e) {
        e = {
          cabinet: rec.cabinet, napId: base, discovered: rec.discovered,
          lat: rec.lat, lon: rec.lon,
          pa: isNaN(newPa) ? '' : newPa,
          pr: isNaN(newPr) ? '' : newPr,
          pt: isNaN(newPt) ? '' : newPt,
          firstPt: isNaN(newPt) ? 0 : newPt,
          territory: territory
        };
        merged.set(base, e); order.push(base);
      } else {
        const pa = typeof e.pa === 'number' ? e.pa : 0;
        const pr = typeof e.pr === 'number' ? e.pr : 0;
        const pt = typeof e.pt === 'number' ? e.pt : 0;
        e.pa = pa + (isNaN(newPa) ? 0 : newPa);
        e.pr = pr + (isNaN(newPr) ? 0 : newPr);
        if (!isNaN(newPt) && newPt === 16 && e.firstPt === 16) e.pt = 16;
        else e.pt = pt + (isNaN(newPt) ? 0 : newPt);
      }

      if (performance.now() - lastTick > 250) {
        const bytePct = Math.min(80, 5 + (bytesRead / totalBytes) * 75);
        setProgress(bytePct, `Parsing… ${fmtNum(readCount)} rows · ${fmtBytes(bytesRead)} / ${fmtBytes(totalBytes)}`);
        await tick();
        lastTick = performance.now();
      }
    }

    setProgress(85, `Enriching ${fmtNum(order.length)} merged NAPs…`);
    await tick();
    const rows = new Array(order.length);
    const missing = [];
    lastTick = performance.now();

    for (let i = 0; i < order.length; i++) {
      const e = merged.get(order[i]);
      const nap = e.napId;
      const pa = e.pa, pt = e.pt;
      const util = (typeof pa === 'number' && typeof pt === 'number') ? calcUtilization(pa, pt) : (pt === 0 ? 0 : '');
      const g = geo[nap] || ['','',''];
      rows[i] = [
        e.cabinet, nap, e.discovered,
        getPlaId(e.cabinet), getTech(e.cabinet),
        pa, e.pr, pt, util,
        e.lat, e.lon,
        getSalesArea(nap), e.territory,
        g[1], g[0], getProvince(nap), g[2]
      ];
      if (!g[0] || !g[1] || !g[2]) {
        missing.push({ napId: nap, city: g[0], brgy: g[1], location: g[2] });
      }
      if ((i & 4095) === 0 && performance.now() - lastTick > 250) {
        const pct = 85 + (i / order.length) * 10;
        setProgress(pct, `Enriching… ${fmtNum(i)} / ${fmtNum(order.length)}`);
        await tick();
        lastTick = performance.now();
      }
    }

    return { rows, missing, read: readCount, skipped, written: rows.length, duration: performance.now() - started };
  }

  function styleHeaderRow_(ws) {
    const hdr = ws.getRow(1);
    hdr.height = 22;
    hdr.eachCell(cell => {
      cell.font = { bold: true };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: HEADER_FILL_ARGB } };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = { bottom: { style: 'thin', color: { argb: 'FFB5C8A8' } } };
    });
  }

  async function buildXlsxBlob(rows) {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('NAP Data');
    ws.columns = OUTPUT_COL_SPECS.map(([header, width, center, numFmt]) => ({
      header: header, width: width,
      style: {
        alignment: center ? { horizontal: 'center', vertical: 'middle' } : undefined,
        numFmt:    numFmt || undefined
      }
    }));
    if (rows.length) ws.addRows(rows);
    styleHeaderRow_(ws);
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    const buffer = await wb.xlsx.writeBuffer();
    return new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  async function buildMissingXlsxBlob(missing) {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Missing Location');
    ws.columns = [
      { header: 'NAP ID',           width: 22 },
      { header: 'CITY_NAME',        width: 24 },
      { header: 'BRGY_NAME',        width: 24 },
      { header: 'LOCATION TAGGING', width: 26 }
    ];
    if (missing.length) {
      ws.addRows(missing.map(m => [m.napId, m.city || '', m.brgy || '', m.location || '']));
    }
    styleHeaderRow_(ws);
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    const buffer = await wb.xlsx.writeBuffer();
    return new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }

  function renderResult(res) {
    $('#resultTabs').hidden = false;
    $('#paneSummary').innerHTML = `
      <div class="summary-stats">
        <div class="stat read"><div class="lbl">Rows read</div><div class="num">${fmtNum(res.read)}</div></div>
        <div class="stat written"><div class="lbl">Rows written</div><div class="num">${fmtNum(res.written)}</div></div>
        <div class="stat skipped"><div class="lbl">Rows skipped</div><div class="num">${fmtNum(res.skipped)}</div></div>
        <div class="stat"><div class="lbl">Time taken</div><div class="num" style="font-size:20px">${fmtDuration(res.duration)}</div></div>
      </div>
      <div class="ok">✅ Conversion complete · output is ${fmtBytes(res.xlsxBytes)}</div>
      <a class="dl" id="dlMain" href="${esc(res.downloadUrl)}" download="${esc(res.downloadName)}">⬇️ Download Excel</a>
      <div class="meta">Report date label: <code>${esc(res.snapshotDate)}</code> · file: <code>${esc(res.downloadName)}</code></div>`;

    if (!res.preview.length) {
      $('#panePreview').innerHTML = '<p class="sub">No rows.</p>';
    } else {
      const CENTER_IDX = new Set([5, 6, 7, 8]);
      const UTIL_IDX = 8;
      const head = OUTPUT_COLS.map((c, i) => {
        const cls = CENTER_IDX.has(i) ? ' style="text-align:center"' : '';
        return `<th${cls}>${esc(c)}</th>`;
      }).join('');
      const body = res.preview.map(r =>
        '<tr>' + r.map((v, i) => {
          let display;
          if (i === UTIL_IDX && typeof v === 'number') display = Math.round(v * 100) + '%';
          else display = esc(v);
          const cls = CENTER_IDX.has(i) ? ' style="text-align:center"' : '';
          return `<td${cls}>${display}</td>`;
        }).join('') + '</tr>').join('');
      $('#panePreview').innerHTML =
        `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    $('#missCount').textContent = res.missing.length;
    if (!res.missing.length) {
      $('#paneMissing').innerHTML = '<p class="ok">✅ No missing-location records. 🎉</p>';
    } else {
      const rows = res.missing.slice(0, 500).map(r => `<tr>
          <td><strong>${esc(r.napId)}</strong></td>
          <td>${r.city ? '<span class="chip ok">✓ ' + esc(r.city) + '</span>' : '<span class="chip err">missing</span>'}</td>
          <td>${r.brgy ? '<span class="chip ok">✓ ' + esc(r.brgy) + '</span>' : '<span class="chip err">missing</span>'}</td>
          <td>${r.location ? '<span class="chip ok">✓ ' + esc(r.location) + '</span>' : '<span class="chip err">missing</span>'}</td>
        </tr>`).join('');
      const more = res.missing.length > 500
        ? `<div class="meta">Showing first 500 of ${fmtNum(res.missing.length)}. Download the Excel below for the full list.</div>` : '';
      $('#paneMissing').innerHTML = `
        <div class="warn">⚠️ ${fmtNum(res.missing.length)} record(s) missing City / Barangay / Location Tagging.</div>
        <div class="actions">
          <button class="primary" id="dlMissing">⬇️ Download Missing as Excel</button>
        </div>
        ${more}
        <div class="scroll" style="margin-top:14px">
          <table><thead><tr><th>NAP ID</th><th>City</th><th>Barangay</th><th>Location Tagging</th></tr></thead><tbody>${rows}</tbody></table>
        </div>`;
      $('#dlMissing').onclick = async () => {
        $('#dlMissing').disabled = true;
        try {
          const blob = await buildMissingXlsxBlob(res.missing);
          triggerDownload(blob, `missing_location_${res.snapshotDate}.xlsx`);
        } finally {
          $('#dlMissing').disabled = false;
        }
      };
    }

    bindTabs($('#resultTabs'));
  }

  function bindTabs(root) {
    $$('.tab', root).forEach(t => {
      t.onclick = () => {
        $$('.tab', root).forEach(x => x.classList.remove('active'));
        $$('.tab-pane', root).forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        $(`.tab-pane[data-pane="${t.dataset.tab}"]`, root).classList.add('active');
      };
    });
  }

  // ============================================================
  // GEO (admin)
  // ============================================================
  function initGeo() {
    bindTabs($('#view .tabs'));

    $('#geoSave').onclick = async () => {
      try {
        const r = await call('upsertGeo', {
          napId: $('#geoNap').value, city: $('#geoCity').value,
          brgy: $('#geoBrgy').value, location: $('#geoLoc').value
        });
        $('#geoStatus').innerHTML = `<div class="ok">✅ ${esc(r.action)} ${esc(r.napId)}</div>`;
        geoData = null;
        refreshGeoList();
      } catch (err) {
        $('#geoStatus').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
      }
    };
    $('#geoLoad').onclick = async () => {
      const napId = $('#geoNap').value.trim();
      if (!napId) return;
      try {
        const r = await call('getGeo', napId);
        if (!r) { $('#geoStatus').innerHTML = '<div class="warn">Not found.</div>'; return; }
        $('#geoCity').value = r.city; $('#geoBrgy').value = r.brgy; $('#geoLoc').value = r.location;
        $('#geoStatus').innerHTML = '<div class="ok">Loaded.</div>';
      } catch (err) {
        $('#geoStatus').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
      }
    };
    $('#geoClear').onclick = () => {
      ['#geoNap','#geoCity','#geoBrgy','#geoLoc'].forEach(s => $(s).value = '');
      $('#geoStatus').innerHTML = '';
    };
    $('#geoDel').onclick = async () => {
      const napId = $('#geoNap').value.trim();
      if (!napId) return;
      if (!confirm(`Delete GEO entry for ${napId}?`)) return;
      if (!confirm('This cannot be undone. Really delete?')) return;
      try {
        const r = await call('deleteGeo', napId);
        $('#geoStatus').innerHTML = r.deleted ? `<div class="ok">🗑️ Deleted.</div>` : '<div class="warn">Not found.</div>';
        geoData = null;
        refreshGeoList();
      } catch (err) {
        $('#geoStatus').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
      }
    };

    $('#bulkFile').addEventListener('change', async e => {
      const f = e.target.files[0];
      if (!f) return;
      $('#bulkText').textContent = `📄 ${f.name}  (${fmtBytes(f.size)})`;
      $('#bulkStatus').innerHTML = '⏳ Parsing Excel…';
      try {
        const buf = await f.arrayBuffer();
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(buf);
        const ws = wb.worksheets[0];
        if (!ws) throw new Error('No sheet found.');
        const headerMap = {};
        ws.getRow(1).eachCell({ includeEmpty: false }, (cell, colNumber) => {
          headerMap[String(cell.value || '').trim().toUpperCase()] = colNumber;
        });
        const need = ['NAP ID', 'CITY_NAME', 'BRGY_NAME', 'LOCATION TAGGING'];
        for (const n of need) if (!headerMap[n]) throw new Error('Missing column: ' + n);
        const cellVal = (row, col) => {
          const v = row.getCell(col).value;
          if (v == null) return '';
          if (typeof v === 'object' && 'text' in v) return String(v.text).trim();
          if (typeof v === 'object' && 'result' in v) return String(v.result).trim();
          return String(v).trim();
        };
        const norm = [];
        for (let r = 2; r <= ws.rowCount; r++) {
          const row = ws.getRow(r);
          const napId = cellVal(row, headerMap['NAP ID']);
          if (!napId) continue;
          norm.push({
            napId: napId,
            city:     cellVal(row, headerMap['CITY_NAME']),
            brgy:     cellVal(row, headerMap['BRGY_NAME']),
            location: cellVal(row, headerMap['LOCATION TAGGING'])
          });
        }
        if (!norm.length) throw new Error('No rows with a NAP ID column.');
        bulkPayload = norm;
        $('#bulkStatus').innerHTML = `<div class="ok">Found ${fmtNum(norm.length)} row(s). Click Upload to send.</div>`;
        $('#bulkGo').disabled = false;
      } catch (err) {
        $('#bulkStatus').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
        $('#bulkGo').disabled = true;
      }
    });
    $('#bulkGo').onclick = async () => {
      if (!bulkPayload) return;
      $('#bulkGo').disabled = true;
      $('#bulkStatus').innerHTML = '⏳ Uploading…';
      try {
        const CHUNK = 1000;
        let added = 0, updated = 0;
        for (let i = 0; i < bulkPayload.length; i += CHUNK) {
          const slice = bulkPayload.slice(i, i + CHUNK);
          const r = await call('bulkUpsertGeoRows', slice);
          added += r.added; updated += r.updated;
          $('#bulkStatus').innerHTML = `⏳ Uploading… ${fmtNum(Math.min(i + CHUNK, bulkPayload.length))} / ${fmtNum(bulkPayload.length)}`;
        }
        $('#bulkStatus').innerHTML = `<div class="ok">✅ ${fmtNum(added + updated)} processed — ${fmtNum(added)} added, ${fmtNum(updated)} updated.</div>`;
        geoData = null;
      } catch (err) {
        $('#bulkStatus').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
      } finally {
        $('#bulkGo').disabled = false;
      }
    };

    $('#geoSearch').addEventListener('input', debounce(refreshGeoList, 200));
    refreshGeoList();
  }

  async function refreshGeoList() {
    if (!$('#geoList')) return;
    try {
      const list = await call('listGeo', $('#geoSearch') ? $('#geoSearch').value : '');
      if (!list.length) { $('#geoList').innerHTML = '<p class="sub">No entries.</p>'; return; }
      $('#geoList').innerHTML = `<div class="scroll"><table><thead><tr>
        <th>NAP ID</th><th>City</th><th>Barangay</th><th>Location Tagging</th><th>Updated</th></tr></thead><tbody>
        ${list.map(r => `<tr>
          <td><strong>${esc(r.napId)}</strong></td>
          <td>${esc(r.city)}</td><td>${esc(r.brgy)}</td><td>${esc(r.location)}</td>
          <td class="meta">${esc((r.updatedAt || '').slice(0,10))} ${esc(r.updatedBy)}</td>
        </tr>`).join('')}</tbody></table></div>`;
    } catch (err) {
      $('#geoList').innerHTML = `<p class="err">${esc(err.message || err)}</p>`;
    }
  }

  function debounce(fn, ms) {
    let t; return function () { clearTimeout(t); t = setTimeout(() => fn.apply(this, arguments), ms); };
  }

  // ============================================================
  // USERS (admin)
  // ============================================================
  function initUsers() {
    $('#userAdd').onclick = async () => {
      const u = $('#newUser').value.trim();
      const p = $('#newPass').value;
      const a = $('#newIsAdmin').checked;
      if (!u || !p) {
        $('#userAddStatus').innerHTML = '<div class="err">Username and password are required.</div>';
        return;
      }
      try {
        const r = await call('adminCreateUser', u, p, a);
        $('#userAddStatus').innerHTML = `<div class="ok">✅ Created ${esc(r.username)}.</div>`;
        $('#newUser').value = ''; $('#newPass').value = ''; $('#newIsAdmin').checked = false;
        refreshUserList();
      } catch (err) {
        $('#userAddStatus').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
      }
    };
    refreshUserList();
  }

  async function refreshUserList() {
    try {
      const list = await call('adminListUsers');
      if (!list.length) { $('#userList').innerHTML = '<p class="sub">No users.</p>'; return; }
      $('#userList').innerHTML = list.map(u => `
        <div class="item">
          <div>
            <strong>${esc(u.username)}</strong> ${u.isAdmin ? '<span class="chip ok">Admin</span>' : '<span class="chip neutral">User</span>'}
            <div class="meta">created ${esc((u.createdAt || '').slice(0,10))} by ${esc(u.createdBy)}${u.lastLogin ? ' · last login ' + esc(u.lastLogin.slice(0,10)) : ''}</div>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap">
            <button class="ghost" data-act="reset" data-u="${esc(u.username)}">Reset password</button>
            <button class="ghost" data-act="toggle" data-u="${esc(u.username)}" data-a="${u.isAdmin ? '1' : '0'}">${u.isAdmin ? 'Revoke admin' : 'Grant admin'}</button>
            <button class="danger" data-act="del" data-u="${esc(u.username)}">Delete</button>
          </div>
        </div>`).join('');
      $$('#userList button').forEach(b => {
        b.onclick = () => userAction(b.dataset.act, b.dataset.u, b.dataset.a === '1');
      });
    } catch (err) {
      $('#userList').innerHTML = `<p class="err">${esc(err.message || err)}</p>`;
    }
  }

  async function userAction(act, username, isAdmin) {
    try {
      if (act === 'reset') {
        const pw = prompt(`Reset password for ${username}. Enter the new password (≥ 8 chars):`);
        if (!pw) return;
        await call('adminResetPassword', username, pw);
        alert(`Password reset for ${username}. They will be signed out and must use the new password.`);
      } else if (act === 'toggle') {
        if (!confirm(`${isAdmin ? 'Revoke' : 'Grant'} admin for ${username}?`)) return;
        await call('adminToggleAdmin', username, !isAdmin);
      } else if (act === 'del') {
        if (!confirm(`Delete user ${username}? This cannot be undone.`)) return;
        await call('adminDeleteUser', username);
      }
      refreshUserList();
    } catch (err) {
      alert(err.message || err);
    }
  }

  // ============================================================
  // CHANGE MY PASSWORD
  // ============================================================
  function initPassword() {
    $('#pwChange').onclick = async () => {
      const cur = $('#curPass').value;
      const np  = $('#newPw').value;
      const np2 = $('#newPw2').value;
      if (!cur || !np || !np2) {
        $('#pwStatus').innerHTML = '<div class="err">All fields are required.</div>'; return;
      }
      if (np !== np2) {
        $('#pwStatus').innerHTML = '<div class="err">New passwords do not match.</div>'; return;
      }
      if (np.length < 8) {
        $('#pwStatus').innerHTML = '<div class="err">New password must be at least 8 characters.</div>'; return;
      }
      try {
        await call('changeMyPassword', cur, np);
        $('#pwStatus').innerHTML = '<div class="ok">✅ Password changed. Other sessions have been signed out.</div>';
        $('#curPass').value = $('#newPw').value = $('#newPw2').value = '';
      } catch (err) {
        $('#pwStatus').innerHTML = `<div class="err">${esc(err.message || err)}</div>`;
      }
    };
  }

  // ============================================================
  // ABOUT
  // ============================================================
  function initAbout() {
    $('#view .cols').innerHTML = OUTPUT_COLS.map(c => `<li>${esc(c)}</li>`).join('');
  }

  // ============================================================
  // Boot
  // ============================================================
  (async function boot() {
    const stored = loadStoredSession();
    if (!stored || !stored.token) { showLogin(); return; }
    try {
      const r = await callRaw('ping', stored.token);
      if (r && r.ok) {
        session = { token: stored.token, username: r.username, isAdmin: r.isAdmin };
        mountApp();
        window.addEventListener('hashchange', () => {
          if (session) render((location.hash || '#converter').slice(1));
        });
        return;
      }
    } catch (e) {}
    clearSession();
    showLogin();
  })();
</script>
